name: DevOps Lab CI

on:
  push:
    branches:
      - main
      - feature/update-web-app
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m py_compile app/app.py

      - name: Build Docker image
        run: docker build -t devops-web:${{ github.sha }} ./app